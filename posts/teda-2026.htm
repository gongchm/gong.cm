  <h1>从“网的需求”到“车的自觉”——面向交能融合构建车企全新竞争力</h1>
  <div class="post-body">
<p>2026年9月20日，第二十二届中国汽车产业发展（泰达）国际论坛在天津滨海新区举行。论坛年度主题是“智绿筑基·生态蓄势·共创共赢”。我在会上作了题为《从“网的需求”到“车的自觉”——面向交能融合构建车企全新竞争力》的报告。</p>
<p><a href="/files/teda-2026.pdf">讲稿 PDF</a>。参见<a href="https://www.ne21.com/news/show-231025.html">世纪新能源网报道</a>。</p>
